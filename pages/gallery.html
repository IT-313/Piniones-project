<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Product Gallery</title>

    <link rel="stylesheet" href="../css/gallery.css">
</head>

<body>

    <header>
        <h1>Our Product Gallery</h1>
        <p>Explore some of our latest gadgets and products.</p>
    </header>

    <main class="gallery">

        <div class="gallery-item">
            <img src="../images/phone.jpg" alt="Smartphone">
            <h2>Smartphones</h2>
            <p>Latest Android and iPhone devices.</p>
        </div>

        <div class="gallery-item">
            <img src="../images/laptop.jpg" alt="Laptop">
            <h2>Laptops</h2>
            <p>Perfect for school, work, and gaming.</p>
        </div>

        <div class="gallery-item">
            <img src="../images/smartwatch.jpg" alt="Smartwatch">
            <h2>Smartwatches</h2>
            <p>Track your health and daily activities.</p>
        </div>

        <div class="gallery-item">
            <img src="../images/accessories.jpg" alt="Accessories">
            <h2>Accessories</h2>
            <p>Chargers, earphones, phone cases, and more.</p>
        </div>

    </main>

</body>

</html>
